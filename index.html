<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koti</title>

  <!--
    On a public hostname with no robots.txt, and there is no reason for it to be
    in a search index. Note this is not a control on what is disclosed - it is a
    request a crawler may ignore. What actually keeps a visitor from learning
    anything is that this shell holds no reading, no location name and no count:
    everything about the home arrives at runtime, in a payload the endpoint only
    sends to a signed-in, allowlisted caller. None of it may become a build-time
    constant. See HOME-017 and config/README.md.
  -->
  <meta name="robots" content="noindex, nofollow" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!--
    The one third-party script on this page, and the only one there is no npm
    alternative to. It is also the ONLY outbound request a signed-out visitor
    causes: src/api.ts returns 'signed-out' without a request ever leaving the
    browser rather than sending a bare header and reading the 401 back.
    src/auth.ts waits on this tag's load, so a blocked CDN becomes a message
    rather than a button that never appears.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" crossorigin src="/assets/index-CgHtjE63.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DmhNXhCY.css">
</head>

<body>
  <header>Koti</header>

  <main>
    <p id="status"></p>
    <div id="signin"></div>
    <!--
      Only ever shown after a failure the reader can retry - never in the loaded
      state, where a refresh control is chrome nobody asked for. It is still what
      makes an expired token reachable: the token is held in memory, so nothing
      else would ever send a stale one.
    -->
    <button id="reload" type="button" hidden></button>
    <section id="payload" hidden></section>
    <!--
      Which account the endpoint accepted. Worth having - it is the only
      trustworthy answer to that question - but not worth leading with, so it
      sits at the bottom in small muted text.
    -->
    <p id="account" hidden></p>
  </main>

</body>

</html>
